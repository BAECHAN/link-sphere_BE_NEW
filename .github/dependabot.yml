# 워크플로의 액션은 커밋 SHA로 고정해 둔다(태그 바꿔치기 대비). 고정한 SHA는 저절로 안 올라가므로
# 이 봇이 새 버전을 한 달에 한 번, PR 하나로 묶어 올린다. 근거와 PR 처리 절차는
# docs/DEPLOY.md "액션 버전 관리" 참고(FE 레포와 같은 설정).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope

  # Gradle 의존성(build.gradle.kts). 2026-10-26 점검에서 Spring Boot 3.5.8·springdoc 2.7.0이 보안 권고 3건(critical 1·
  # high 2)에 걸린 채 지나간 것을 계기로 추가했다(docs/plans/2026-10-26-be-remaining-cleanup.md). build.gradle.kts는
  # deploy.yml 경로 필터에 있어 이 PR을 병합하면 곧 운영 배포·prod 승격이다 - 처리 절차는 docs/DEPLOY.md
  # "Gradle 의존성 업데이트". Boot·springdoc 메이저(Boot 4·springdoc 3 — 서로 묶여 움직이고 Hibernate 7이 따라온다)는
  # 이 봇으로 올리지 않고 따로 계획한다. 그 밖의 메이저는 그룹 밖 개별 PR로 온다.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'org.springframework.boot*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.springdoc*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
