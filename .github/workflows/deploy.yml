name: Deploy to AWS Lambda (SnapStart)

# main 브랜치에 소스 변경이 push될 때 실행 + 수동 재실행 가능
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. 소스 체크아웃
      # ─────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Java 17 설치 (Amazon Corretto — Lambda java17 런타임과 동일 JDK 계열)
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      # ─────────────────────────────────────────────
      # 3. Gradle 의존성 캐시 (빌드 시간 단축)
      # ─────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ─────────────────────────────────────────────
      # 4. Firebase 서비스 계정 JSON 파일 생성
      #    GitHub Secret → src/main/resources/firebase-service-account.json
      #    → shadowJar에 포함 → Lambda에서 classpath:firebase-service-account.json 으로 읽음
      #    (application.yml: firebase.service-account-key-path: classpath:firebase-service-account.json)
      # ─────────────────────────────────────────────
      - name: Write Firebase service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' \
            > src/main/resources/firebase-service-account.json

      # ─────────────────────────────────────────────
      # 5. Ktlint 코드 스타일 검사 + 테스트 실행 후 Shadow JAR 빌드 (fat JAR — 모든 의존성 포함)
      #    스타일 위반이나 테스트 실패가 있으면 빌드/배포 전에 실패한다.
      #    firebase-service-account.json 없이도 테스트가 통과함을 확인함 (2026-09-03).
      # ─────────────────────────────────────────────
      - name: Ktlint check, test & Build Shadow JAR
        run: chmod +x gradlew && ./gradlew ktlintCheck test shadowJar --no-daemon

      # ─────────────────────────────────────────────
      # 6. JAR 파일 유효성 확인
      # ─────────────────────────────────────────────
      - name: Verify Shadow JAR
        run: |
          JAR_PATH=$(ls build/libs/*-all.jar 2>/dev/null | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "ERROR: Shadow JAR not found!"
            ls -la build/libs/ || true
            exit 1
          fi
          echo "JAR: $JAR_PATH  ($(du -h "$JAR_PATH" | cut -f1))"
          unzip -l "$JAR_PATH" | grep -q "LambdaHandler" \
            || { echo "ERROR: LambdaHandler class not found in JAR!"; exit 1; }
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      # 7. AWS 자격증명 설정
      #    GitHub Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      #    GitHub Variables: AWS_REGION
      # ─────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ─────────────────────────────────────────────
      # 8. JAR → S3 업로드
      #    GitHub Variables: AWS_S3_BUCKET
      # ─────────────────────────────────────────────
      - name: Upload JAR to S3
        run: |
          S3_KEY="deployments/$(date +%Y%m%d-%H%M%S).jar"
          aws s3 cp "$JAR_PATH" "s3://${{ vars.AWS_S3_BUCKET }}/$S3_KEY"
          echo "S3_KEY=$S3_KEY" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      # 9. Lambda 함수 코드 업데이트 (S3 참조)
      #    GitHub Variables: LAMBDA_FUNCTION_NAME
      #    아키텍처(arm64), 핸들러, SnapStart 설정은 최초 함수 생성 시 한 번만 설정.
      #    deploy.yml에서는 코드만 교체한다.
      # ─────────────────────────────────────────────
      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ vars.AWS_S3_BUCKET }}" \
            --s3-key "$S3_KEY"

      # ─────────────────────────────────────────────
      # 10. 코드 업데이트 완료 대기
      # ─────────────────────────────────────────────
      - name: Wait for function code update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      # ─────────────────────────────────────────────
      # 11. 버전 발행 → SnapStart 스냅샷 생성 트리거
      #     SnapStart는 버전 발행 시에만 스냅샷을 생성한다 ($LATEST에는 적용 안 됨).
      #     prod alias는 이 버전 번호를 참조한다.
      # ─────────────────────────────────────────────
      - name: Publish Lambda version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --query 'Version' --output text)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published version: $VERSION"
          echo "::notice::Published version: $VERSION — 연속 호출 검증 후 통과하면 자동 승격됩니다"

      # ─────────────────────────────────────────────
      # 12. SnapStart 최적화 완료 대기 (스냅샷 생성까지 1~5분 소요)
      # ─────────────────────────────────────────────
      - name: Wait for SnapStart optimization
        run: |
          aws lambda wait published-version-active \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --qualifier "${{ steps.publish.outputs.VERSION }}"

      # ─────────────────────────────────────────────
      # 13. 새 버전 직접 연속 호출 검증 (자동 승격 게이트)
      #     2026-07-25 502 장애는 "복원 후 첫 요청은 성공, 이후 실패" 패턴이라 단발
      #     확인으로는 못 잡았다(docs/PERFORMANCE.md 5장). prod가 아니라 방금 발행한
      #     버전 번호를 직접 지정해 호출하므로 이 단계에서는 사용자 트래픽에 영향이
      #     없다. 5회 중 하나라도 실패하면 워크플로우가 실패하고 prod는 이전 버전을
      #     그대로 유지한다 — 아래 승격 스텝 자체가 실행되지 않는다.
      #     GET /post는 비로그인 공개 엔드포인트라 별도 인증 없이 호출 가능하다
      #     (docs/PERFORMANCE.md 5장의 검증 페이로드와 동일한 것을 재사용).
      # ─────────────────────────────────────────────
      - name: Verify new version with repeated invokes
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: |
          echo '{"rawPath":"/api/post","rawQueryString":"page=0&size=5","requestContext":{"http":{"method":"GET"}}}' \
            > /tmp/verify-event.json

          for i in 1 2 3 4 5; do
            aws lambda invoke \
              --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}:$VERSION" \
              --payload fileb:///tmp/verify-event.json \
              "/tmp/verify-out-$i.json" > /dev/null

            STATUS=$(jq -r '.statusCode' "/tmp/verify-out-$i.json")
            echo "호출 $i: statusCode=$STATUS"

            if [ "$STATUS" != "200" ]; then
              echo "::error::버전 $VERSION 호출 ${i}회차 실패(statusCode=$STATUS) — 승격 중단, prod는 이전 버전 유지"
              cat "/tmp/verify-out-$i.json"
              exit 1
            fi
          done

          echo "5회 연속 정상 확인 완료"

      # ─────────────────────────────────────────────
      # 14. 검증 통과 → prod alias 자동 승격
      # ─────────────────────────────────────────────
      - name: Promote prod alias
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: |
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name prod \
            --function-version "$VERSION"
          echo "::notice::prod alias를 버전 $VERSION 으로 승격했습니다"

      # ─────────────────────────────────────────────
      # 15. 승격된 Function URL 출력
      # ─────────────────────────────────────────────
      - name: Show deployed Function URL
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --qualifier prod \
            --query 'FunctionUrl' --output text 2>/dev/null \
            || echo "(Function URL not configured yet)")
          echo "::notice::prod URL (버전 ${{ steps.publish.outputs.VERSION }} 서빙 중): $URL"
          echo "Deployed to: $URL"
