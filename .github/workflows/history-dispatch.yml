name: BE History Dispatch

# main 브랜치에 소스 변경이 push되면, BE 커밋 로그를 FE 레포로 보내 FE의
# Gemini History Updater(docs/HISTORY.md 자동 생성)가 같이 반영하도록 한다.
# 배포(deploy.yml)와 완전히 별도 워크플로라 여기서 실패해도 배포엔 영향 없다.
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃 (전체 히스토리 — git log 범위 계산에 필요)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 커밋 로그 추출
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            # 첫 push 등 이전 커밋을 알 수 없는 경우 최근 5개로 대체 (FE 스크립트 fallback과 동일)
            git log -5 --pretty=format:"- %s" > /tmp/logs.txt
          else
            git log "$BEFORE".."${{ github.sha }}" --pretty=format:"- %s" > /tmp/logs.txt
          fi
          cat /tmp/logs.txt

      # 배포와 무관한 부가 작업이므로 실패해도 워크플로 전체를 실패로 만들지 않는다
      - name: FE 레포에 repository_dispatch 발송
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HISTORY_DISPATCH_TOKEN }}
        run: |
          if [ ! -s /tmp/logs.txt ]; then
            echo "새로운 커밋이 없어 전송할 로그가 없습니다."
            exit 0
          fi
          gh api repos/BAECHAN/link-sphere_FE_NEW/dispatches \
            --method POST \
            -f event_type=be-history-update \
            -f client_payload[logs]="$(cat /tmp/logs.txt)" \
            -f client_payload[source]=BE
