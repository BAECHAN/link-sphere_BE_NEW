name: API Docs Deploy (GitHub Pages)

# 현재 main 코드의 OpenAPI 스펙을 읽기 전용 Swagger UI로 이 저장소의 GitHub Pages(https://baechan.github.io/link-sphere_BE_NEW/api-docs/)에
# 올린다. 운영 Lambda에는 Swagger UI가 없다(developmentOnly, build.gradle.kts). 사이트 루트는 pages-site/(첫 화면, FE·BE
# Pages 문서 목록)이고 문서마다 하위 경로를 쓴다.
#
# 운영 도메인(linksphere.click)이 아니라 github.io에 올리는 이유: 같은 출처에서 도는 스크립트는 refresh 쿠키를 붙여
# /api/auth/refresh를 부를 수 있어, 앱이 아닌 코드(Swagger UI)를 그 출처에 두지 않는다. FE Storybook도 같은 이유로
# FE 저장소 Pages에 있다(docs/plans/2026-10-30-docs-to-github-pages.md).
#
# - 파일: swaggerUiSite 태스크가 swagger-ui webjar(springdoc이 끌어옴)와 api-docs-site/의 설정을 build/api-docs-site/에 모은다
# - 스펙: openApiSpec(api-compat.yml과 같은 태스크, Docker 필요)으로 만들고 servers만 운영 주소로 바꾼다
on:
  push:
    branches: ['main']
    paths:
      - 'src/main/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'api-docs-site/**'
      - 'pages-site/**'
      - '.github/workflows/api-docs-pages.yml'
  workflow_dispatch:

concurrency:
  # GitHub 공식 Pages 예제(actions/starter-workflows pages/static.yml)와 같다 - 진행 중인 게시를 취소하지 않고
  # 순서대로 처리한다.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 올리는 잡(build)과 게시하는 잡(deploy)을 나눈다. deploy-pages는 산출물을 이름으로 찾을 때 목록을 한 번만 조회하는데,
  # 한 잡 구조이던 FE Storybook 배포가 올린 직후(0.3~0.4초 뒤)의 조회가 비어 실패했다(2026-11-24 실행 3개, 같은 증상:
  # https://github.com/actions/deploy-pages/issues/451). 이 워크플로는 그렇게 실패한 적이 없지만 같은 액션·같은 구조라 맞춘다.
  # 잡을 나누면 조회가 다음 잡이 시작된 뒤로 밀리고, 실패해도 deploy 잡만 다시 돌릴 수 있다 - 한 잡이면 재실행이 산출물을
  # 하나 더 올려 "Multiple artifacts"로 다시 실패한다. deploy-pages README가 권하는 구조다
  # (https://github.com/actions/deploy-pages#usage). 복구 절차는 docs/DEPLOY.md "공개 API 문서 (GitHub Pages)", 경위는
  # FE docs/DEPLOY.md "Storybook 공개 배포"의 "잡 구조와 실패 복구".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 스펙 생성과 Swagger UI 파일 모으기
        run: chmod +x gradlew && ./gradlew openApiSpec swaggerUiSite --no-daemon

      # springdoc은 요청받은 오리진을 servers에 채운다(OpenApiSpecExportTest는 MockMvc라 http://localhost). 화면에 보이는
      # 주소를 운영 API 기준 주소로 바꾼다.
      # swaggerUiSite는 Sync라 출력 폴더에 없는 파일을 지우므로, 스펙은 그 뒤에 넣는다
      - name: 스펙 넣기
        run: |
          jq '.servers = [{"url": "https://linksphere.click/api"}]' build/openapi/openapi.json > build/api-docs-site/openapi.json
          test -s build/api-docs-site/swagger-ui-bundle.js

      # Pages는 배포마다 사이트 전체를 바꾼다(actions/deploy-pages#50) - 이 사이트에 다른 문서를 더할 때도 다른
      # 워크플로로 따로 올리지 말고 여기서 함께 만들어 자기 하위 경로에 넣는다.
      - name: 사이트 조립
        run: |
          mkdir -p build/pages-site
          cp -R pages-site/. build/pages-site/
          cp -R build/api-docs-site build/pages-site/api-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 게시 권한은 이 잡에만 준다 - build 잡은 Gradle 의존성 코드가 도는 구간이라 contents: read만 갖는다
    permissions:
      pages: write # Pages 게시
      id-token: write # deploy-pages가 게시 요청을 OIDC 토큰으로 증명한다
    # 저장소 Pages 소스가 "GitHub Actions"일 때 쓰는 환경 - main만 배포하도록 보호 규칙이 걸려 있다(docs/DEPLOY.md)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
