name: CI

# PR에 대해 ktlint·컴파일·테스트를 검증한다. 지금까지는 deploy.yml(push:main)만 있어서
# PR 단계에서 검사가 전혀 안 됐고, deploy.yml도 ktlintCheck+shadowJar만 돌려 테스트 22개가
# CI에서 한 번도 실행된 적이 없었다.
on:
  # base 브랜치 필터를 두지 않는다 - branches: ['main']이면 다른 PR 브랜치를 base로 하는
  # 스택 PR에서 이 워크플로 자체가 트리거되지 않아 ktlint·테스트가 한 번도 돌지 않는다.
  # FE는 이 사각지대를 실측하고 같은 필터를 없앴다(FE PR #111, 2026-09-16). "docs/plans
  # 불변성 확인" 스텝은 github.base_ref를 동적으로 참조하므로 스택 PR에서도 맞게 동작한다.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # pull-requests: write는 "커버리지 보고" 스텝이 결과 댓글을 달고 갱신하는 데 필요하다(FE ci.yml mutation 잡과 같은 이유)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: docs/plans 불변성 확인
        # docs/plans/*.md는 plan mode 계획의 스냅샷이라 커밋된 뒤 수정하지 않는다
        # (append-only, ADR·DB 마이그레이션 파일과 같은 컨벤션). 이탈은 새 파일이 아니라
        # PR 본문의 "## 계획 대비 구현" 섹션에 적는다.
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- docs/plans/ \
            | awk '$1 == "M" { print $2 }')
          if [ -n "$changed" ]; then
            echo "docs/plans/ 파일은 커밋된 뒤 수정하지 않습니다(append-only, ADR과 같은 규칙)."
            echo "이탈은 새 파일이 아니라 PR 본문의 '## 계획 대비 구현' 섹션에 적으세요."
            echo "$changed"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # integrationTest는 실제 Postgres 컨테이너(Testcontainers)를 띄운다 - GitHub 호스팅 러너의 Docker를 쓴다
      # shadowJar는 deploy.yml이 배포하는 fat JAR를 PR에서도 만들어 본다. 이게 없을 때 Gradle 9 wrapper PR(#120)이
      # 테스트는 통과했지만 Shadow 8.1.1이 Gradle 9에서 JAR를 못 만들어 병합했다면 배포가 빌드 단계에서 멈췄다.
      - name: Ktlint check, test, integration test & Build Shadow JAR
        run: chmod +x gradlew && ./gradlew ktlintCheck test integrationTest shadowJar --no-daemon

      - name: 커버리지 보고 (정보용 — 실패해도 잡은 통과)
        # 이 PR이 바꾼 src/main/kotlin 파일의 커버리지와, 바꾼 줄 중 테스트가 실행하지 않은 줄을 Step Summary와 PR 댓글로
        # 보인다(FE ci.yml mutation 잡과 같은 모양, docs/CI-CHECK-GATE.md "커버리지 보고"). 위 스텝이 통과했을 때만 돈다 -
        # 테스트가 실패하면 실행 데이터가 모자라 비율이 틀린다. 리포트는 대상이 있을 때만 만든다.
        # 댓글은 PR마다 하나다 - 맨 앞 표식 주석으로 이전 댓글을 찾아 갱신하고, 없으면 대상이 있을 때만 새로 단다.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          targets="$RUNNER_TEMP/coverage-targets.txt"
          report="$RUNNER_TEMP/coverage-report.md"
          comment="$RUNNER_TEMP/coverage-comment.md"
          marker='<!-- coverage-report -->'

          python3 scripts/coverage-report.py --targets "$BASE_SHA" > "$targets"
          cat "$targets"

          if [ -s "$targets" ]; then
            ./gradlew coverageReport --no-daemon
          fi

          python3 scripts/coverage-report.py --report build/reports/jacoco/coverageReport/coverageReport.xml "$targets" "$BASE_SHA" > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          { echo "$marker"; cat "$report"; } > "$comment"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment" > /dev/null
          elif [ -s "$targets" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi
