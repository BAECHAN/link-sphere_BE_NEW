server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: link-sphere_BE
  profiles:
    active: secret  # 로컬: application-secret.yml 로딩 / Lambda: 환경변수로 오버라이드
  autoconfigure:
    # 인증은 SessionAuthenticationFilter만 한다. Boot 기본 사용자(InMemoryUserDetailsManager, 생성 비밀번호를 WARN으로 남김)는
    # oauth2-client가 클래스패스에 있어 저절로 꺼져 있었다 - 그 의존성을 지운 뒤(2026-10-26) 직접 끈다. @SpringBootApplication의
    # exclude가 아니라 이 속성인 이유: @WebMvcTest 슬라이스도 이 속성은 읽는다(SecurityAutoConfigurationTest)
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      # 0이면 풀이 혼자 커넥션을 미리 만들지 않고 요청이 기다릴 때만 만든다. 1일 때는 워밍 핑(수 ms)
      # 사이에 시작된 백그라운드 보충이 Lambda가 환경을 얼리는 바람에 인증 도중 멈추고, 풀러가 15초 뒤
      # EAUTHTIMEOUT으로 끊는 일이 하루 약 30건 반복됐다(docs/DEPLOY.md 시행착오 9)
      minimum-idle: 0
      maximum-pool-size: 5   # Lambda 동시 실행 컨테이너 수에 맞게 조정
      idle-timeout: 600000   # 10분
      max-lifetime: 1800000  # 30분
      keepalive-time: 30000  # 30초마다 idle 커넥션 핑 → 유휴 중 끊김 방지
      connection-test-query: SELECT 1  # pool에서 꺼낼 때 연결 유효성 검사 → SnapStart 복원 후 죽은 연결 즉시 교체
      allow-pool-suspension: true  # SnapStart 체크포인트 전 pool 일시 중단 허용 (미설정 시 checkpoint 경고)
  jmx:
    enabled: false  # 기동 시 MBean 등록 단계 생략 → 콜드스타트 단축
  jpa:
    database: POSTGRESQL
    open-in-view: false  # 요청당 커넥션을 뷰 렌더까지 붙들지 않음 (미설정 시 기본 true + 기동 경고)
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        # TablePost.categoryIds(@ElementCollection, LAZY)가 목록 조회 시 페이지 크기만큼 추가
        # 쿼리를 내던 N+1을 배치 IN 쿼리로 묶는다. fetch join은 페이지네이션과 함께
        # 쓰면 Hibernate가 LIMIT/OFFSET을 SQL이 아니라 메모리에서 적용해(컬렉션
        # fetch join 특유의 제약) 오히려 더 느려지므로 이 설정으로 대신한다.
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # 워밍 핑(/actuator/health, 5분 주기)이 커넥션을 빌려 SELECT 1로 확인하게 해 핑을 받는 컨테이너의
      # 연결을 데워 둔다 - minimum-idle: 0과 짝이다(docs/DEPLOY.md §6·시행착오 9)
      enabled: true
    diskSpace:
      enabled: false

app:
  cors:
    # SecurityConfig.corsConfigurationSource()가 Binder로 읽는다 - Spring Boot relaxed
    # binding 덕분에 Lambda 환경변수 APP_CORS_ALLOWED_ORIGINS(쉼표 구분 문자열)로도
    # 덮어쓸 수 있다. 커스텀 도메인 연결 때 이 목록에 없어서 로그인이 403 Invalid
    # CORS request로 막힌 적이 있다(2026-09-29) - 도메인을 새로 붙이면 반드시 이 목록도
    # 같이 갱신한다.
    allowed-origins:
      - http://localhost:*
      - https://localhost:*
      - https://dbw3brui6htwk.cloudfront.net
      - https://linksphere.click
      - https://www.linksphere.click
  frontend:
    # 비밀번호 재설정·이메일 인증 메일의 링크를 만들 때와, 댓글에 붙은 주소가 우리 글인지
    # 가릴 때(PostLinkParser), 미리보기 봇용 OG HTML의 og:url을 만들 때(PostOgService) 쓴다.
    # APP_FRONTEND_URL 환경변수로 덮어쓸 수 있다
    # (docs/DEPLOY.md 참고). 커스텀 도메인(linksphere.click) 확정 후 기본값을 이걸로
    # 바꿈(2026-09-29).
    url: https://linksphere.click
  mail:
    # SES에서 검증된 발신 주소. 비어있으면 MailService가 발송을 건너뛴다(fail-open) -
    # 도메인 확정 전까지는 Lambda 환경변수 APP_MAIL_FROM으로 개별 검증한 주소를 설정한다.
    from: ""
  job:
    # 뒷일(AI 분석·댓글 알림·피드 항목 처리)을 어떻게 넘길지 고른다(global/job/JobPublisher, docs/BE-ARCHITECTURE.md §7-5).
    # - in-process: 같은 프로세스의 전용 스레드에서 처리한다. 개발 환경 기본값 - 글을 등록하면 Gemini 호출과 크롤링이 실제로 돈다
    # - lambda: Lambda self-invoke. LambdaHandler가 init에서 시스템 프로퍼티로 넣는다(운영)
    # - skip: 넘기지 않고 버린다. 아래 tools 프로필의 기본값
    publisher: in-process
  og-thumbnail:
    # 피드 카드용 og 이미지 사본(domain/post/OgThumbnailService, docs/plans/2026-11-25-og-thumbnail.md)을 어디에 둘지 고른다.
    # - skip: 사본을 만들지 않는다(원본도 받지 않는다). 로컬·테스트 기본값 - og_image_thumbnail이 null이라 FE가 원본을 그린다
    # - s3: FE 버킷의 og-thumbnails/에 올린다. LambdaHandler가 init에서 시스템 프로퍼티로 넣는다(운영)
    storage: skip
    bucket: link-sphere-fe-bucket
    region: ap-northeast-2
    # FE 배포의 s3 sync --delete가 이 접두어를 빼고 동기화한다(FE deploy.yml). 바꾸면 FE 쪽 제외 줄도 같이 바꾼다
    key-prefix: og-thumbnails/
    # CloudFront가 이 경로를 같은 버킷의 접두어로 보낸다. 컬럼에는 이 주소로 시작하는 절대 주소가 들어간다
    public-base-url: https://linksphere.click/og-thumbnails/

logging:
  level:
    root: INFO
    com.example.linksphere: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql: ERROR

gemini:
  api:
    # 앞에서부터 시도하고, 쿼터 소진(429)·서버 오류(5xx)면 다음 모델로 폴백한다
    models: gemini-2.5-flash,gemini-3.1-flash-lite

firebase:
  service-account-key-path: classpath:firebase-service-account.json

---
# 로컬 1회성 도구(tools/*Runner)는 뒷일을 넘기지 않는다 - 도구가 글을 만들 때마다 Gemini 호출과 크롤링이 따라 돌지 않게 한다.
# 돌리고 싶으면 실행 인자에 --app.job.publisher=in-process를 준다. 도구 프로필을 더하면 이 목록에도 넣는다
# (JobWiringTest가 빠진 프로필을 잡는다).
spring:
  config:
    activate:
      on-profile: "feed-crawl | ai-backfill | embedding-backfill | post-japanese-scan | og-image-backfill | post-locale-backfill | cleanup-orphans"
app:
  job:
    publisher: skip
