server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: link-sphere_BE
  profiles:
    active: secret  # 로컬: application-secret.yml 로딩 / Lambda: 환경변수로 오버라이드
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 1        # Lambda는 요청 처리 후 유휴 상태 → idle 커넥션 최소화
      maximum-pool-size: 5   # Lambda 동시 실행 컨테이너 수에 맞게 조정
      idle-timeout: 600000   # 10분
      max-lifetime: 1800000  # 30분
      keepalive-time: 30000  # 30초마다 idle 커넥션 핑 → 유휴 중 끊김 방지
      connection-test-query: SELECT 1  # pool에서 꺼낼 때 연결 유효성 검사 → SnapStart 복원 후 죽은 연결 즉시 교체
      allow-pool-suspension: true  # SnapStart 체크포인트 전 pool 일시 중단 허용 (미설정 시 checkpoint 경고)
  jmx:
    enabled: false  # 기동 시 MBean 등록 단계 생략 → 콜드스타트 단축
  jpa:
    database: POSTGRESQL
    open-in-view: false  # 요청당 커넥션을 뷰 렌더까지 붙들지 않음 (미설정 시 기본 true + 기동 경고)
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        # TablePost.categories(@ManyToMany, LAZY)가 목록 조회 시 페이지 크기만큼 추가
        # 쿼리를 내던 N+1을 배치 IN 쿼리로 묶는다. fetch join은 페이지네이션과 함께
        # 쓰면 Hibernate가 LIMIT/OFFSET을 SQL이 아니라 메모리에서 적용해(컬렉션
        # fetch join 특유의 제약) 오히려 더 느려지므로 이 설정으로 대신한다.
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false
    diskSpace:
      enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:*
      - https://localhost:*
      - https://dbw3brui6htwk.cloudfront.net

logging:
  level:
    root: INFO
    com.example.linksphere: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql: ERROR

gemini:
  api:
    # 앞에서부터 시도하고, 쿼터 소진(429)·서버 오류(5xx)면 다음 모델로 폴백한다
    models: gemini-2.5-flash,gemini-3.1-flash-lite

firebase:
  service-account-key-path: classpath:firebase-service-account.json
